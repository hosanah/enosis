<p-card header="Diretrizes de Reserva de Mesa">
  <p-table [value]="diretrizes" [loading]="loading" [paginator]="false" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Diretriz</th>
        <th>Descrição</th>
        <th>Ativo</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-d>
      <tr>
        <td>{{ d.nome }}</td>
        <td>{{ d.descricao }}</td>
        <td>
          <p-toggleSwitch [ngModel]="!!d.habilitado" (onChange)="onToggle(d)"></p-toggleSwitch>
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<p-card header="Ação ao concluir a marcação" *ngIf="whatsappConfig as config">
  <div class="whatsapp-action-settings">
    <label for="whatsapp-action">Ao concluir a marcação</label>
    <select id="whatsapp-action" [(ngModel)]="config.action">
      <option value="print">Imprimir voucher</option>
      <option value="send">Enviar WhatsApp</option>
      <option value="both">Enviar WhatsApp e imprimir</option>
    </select>
    <button type="button" (click)="salvarAcaoWhatsApp()" [disabled]="savingWhatsAppAction">
      {{ savingWhatsAppAction ? 'Salvando…' : 'Salvar configuração' }}
    </button>
  </div>
</p-card>
